name: Build NovaGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          if [ -f "NovaGuard-APK-Project.zip" ]; then
            unzip -o NovaGuard-APK-Project.zip
          fi

      - name: Download hev-socks5-tunnel AAR & Aether Android Cores
        run: |
          set -e
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64 tmp_cores

          # 1. hev-socks5-tunnel v2.20.0 AAR (all ABIs + classes.jar)
          curl -fSL "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar" -o app/libs/hev-socks5-tunnel.aar
          echo "ae8a2e96b80b4eccccd037805a4bb4a278090c89dbcae8bc6fcb7634e9a255b9  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
          unzip -l app/libs/hev-socks5-tunnel.aar | grep -q "classes.jar"

          # 2. CluvexStudio/Aether v2.4.0 Android binaries
          curl -fSL "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-android-arm64.tar.gz" -o tmp_cores/arm64.tar.gz
          echo "02f1a1d673cf2f3e5592c90ce7ef4d6f03e218d41a333bdd175e0da92ce2073c  tmp_cores/arm64.tar.gz" | sha256sum -c -

          curl -fSL "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-android-armv7.tar.gz" -o tmp_cores/armv7.tar.gz
          echo "13a170d175eab5a64d69c6fa3c174430754f01171d616a00eba0b3598315da1d  tmp_cores/armv7.tar.gz" | sha256sum -c -

          curl -fSL "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-android-x86_64.tar.gz" -o tmp_cores/x86_64.tar.gz
          echo "b8d18baf6b1efe120d04109f819d08ca822c1fafeb3d61297b0e035cf095ae07  tmp_cores/x86_64.tar.gz" | sha256sum -c -

          extract_aether() {
            archive="$1"
            abi="$2"
            mkdir -p "tmp_cores/$abi"
            tar -xzf "$archive" -C "tmp_cores/$abi"
            bin_path=$(find "tmp_cores/$abi" -type f -name "aether" | head -n 1)
            if [ -z "$bin_path" ]; then
              echo "Could not find aether binary in $archive"
              exit 1
            fi
            cp "$bin_path" "app/src/main/jniLibs/$abi/libaether.so"
            chmod 0755 "app/src/main/jniLibs/$abi/libaether.so"
          }

          extract_aether tmp_cores/arm64.tar.gz arm64-v8a
          extract_aether tmp_cores/armv7.tar.gz armeabi-v7a
          extract_aether tmp_cores/x86_64.tar.gz x86_64
          rm -rf tmp_cores

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.jks -alias novaguard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass novaguard123 -keypass novaguard123 \
            -dname "CN=NovaGuard, OU=App, O=NovaGuard, L=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Optimized Release & Debug APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: novaguard123
          RELEASE_KEY_ALIAS: novaguard
          RELEASE_KEY_PASSWORD: novaguard123
        run: gradle assembleRelease assembleDebug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaGuard-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
